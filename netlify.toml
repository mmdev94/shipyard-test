[build]
  publish = "."

[[redirects]]
  from = "/old-about"
  to = "/about"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/posts/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Moved-From = "netlify"
